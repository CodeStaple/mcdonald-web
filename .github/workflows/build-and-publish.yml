name: Build and Publish

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/default" --config "p/javascript" --config "p/docker" --config "p/github-actions" --json --output semgrep-results.json || true
        continue-on-error: true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('semgrep-results.json') != ''
        with:
          name: ankra-semgrep-scan
          path: semgrep-results.json
          retention-days: 90

      - name: Run Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          output_format: json
          output_file_path: checkov-results.json
          soft_fail: true
          framework: dockerfile,helm,github_actions
        continue-on-error: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('checkov-results.json') != ''
        with:
          name: ankra-checkov-scan
          path: checkov-results.json
          retention-days: 90

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.short_sha }}
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-results.json') != ''
        with:
          name: ankra-security-scan
          path: trivy-results.json
          retention-days: 90

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm chart to GHCR
        env:
          OWNER_LC: ${{ github.repository_owner }}
        run: |
          if [ -d "chart" ]; then
            OWNER_LC=$(echo "$OWNER_LC" | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=${GITHUB_SHA::7}
            CHART_VERSION="0.1.0+sha.${SHORT_SHA}"
            APP_VERSION="sha-${SHORT_SHA}"
            helm package chart/ --version "$CHART_VERSION" --app-version "$APP_VERSION"
            echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
            helm push *.tgz "oci://ghcr.io/$OWNER_LC/charts"
          fi

      - name: Make packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_PKG: ${{ github.event.repository.name }}
          CHART_PKG: charts%2Fmcdonald-web
        run: |
          set +e
          for pkg in "$IMAGE_PKG" "$CHART_PKG"; do
            echo "Setting $pkg to public..."
            if gh api -X PATCH -H "Accept: application/vnd.github+json" "/orgs/$OWNER/packages/container/$pkg" -f visibility=public >/dev/null 2>&1; then
              echo "  done (org)"
              continue
            fi
            if gh api -X PATCH -H "Accept: application/vnd.github+json" "/user/packages/container/$pkg" -f visibility=public >/dev/null 2>&1; then
              echo "  done (user)"
              continue
            fi
            echo "  skipped — flip visibility once in the GHCR UI: https://github.com/orgs/$OWNER/packages/container/$pkg/settings"
          done
